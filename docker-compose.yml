services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gki-graharaya/company-profile
    container_name: company-profile
    ports:
      - "3000:3000"
    environment:
      # API_BASE_URL dibaca server-side saat runtime (bukan NEXT_PUBLIC_),
      # jadi bisa diganti tanpa build ulang.
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3001/api}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
