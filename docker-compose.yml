services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* di-inline ke bundle browser saat `next build`, jadi
        # nilainya HARUS diberikan sebagai build arg — menyuntikkannya lewat
        # `environment:` di bawah tidak akan pernah berpengaruh karena saat
        # container jalan, nilainya sudah beku di dalam image.
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # Versi service worker + build id Next. Isi dengan commit SHA.
        - BUILD_ID=${BUILD_ID:-}
    image: sada/web
    container_name: sada-web
    ports:
      - "3000:3000"
    environment:
      # API_BASE_URL dibaca server-side saat runtime (bukan NEXT_PUBLIC_),
      # jadi nilainya bisa diganti tanpa build ulang image.
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3001/api}
    restart: unless-stopped
