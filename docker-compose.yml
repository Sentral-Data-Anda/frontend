services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* di-inline ke bundel saat build; mengisinya lewat
        # `environment:` tidak berpengaruh.
        - VITE_SITE_URL=${VITE_SITE_URL:-http://localhost:3000}
        # Versi service worker. Isi dengan commit SHA.
        - BUILD_ID=${BUILD_ID:-}
    image: sada/web
    container_name: sada-web
    ports:
      - "3000:3000"
    environment:
      # Dibaca nginx saat container start; bisa diganti tanpa build ulang.
      - API_UPSTREAM=${API_UPSTREAM:-http://host.docker.internal:3001}
      - MEDIA_UPSTREAM=${MEDIA_UPSTREAM:-http://host.docker.internal:9000}
      # Kontrak alamat pengguna dengan be-sada PROXY_SHARED_SECRET
      # (docs/03-api-contract.md "Header proxy").
      - BACKEND_PROXY_SECRET=${BACKEND_PROXY_SECRET:-}
      - MEDIA_ORIGIN=${MEDIA_ORIGIN:-}
    restart: unless-stopped
