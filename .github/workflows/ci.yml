name: CI

# Repo ini belum punya git remote saat berkas ini ditulis, jadi workflow ini
# belum pernah benar-benar dijalankan oleh GitHub Actions. Trigger dan step
# di bawah ditulis konservatif (versi resmi oven-sh/setup-bun + checkout),
# supaya begitu remote dipasang, workflow langsung jalan tanpa perlu diutak-atik.
on:
  push:
    branches:
      - main
      - development
      - production
  pull_request:

# Batalkan run lama pada branch/PR yang sama saat ada push baru, supaya
# tidak menumpuk run yang sudah usang.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pembagian kerja dengan Vercel.
      #
      # Target deploy aplikasi ini adalah Vercel, dan Vercel menjalankan
      # `next build` pada setiap push (preview) serta pada branch produksi.
      # Karena itu step `build` SENGAJA TIDAK ADA di sini — menjalankannya
      # dua kali hanya menggandakan waktu tunggu tanpa menambah cakupan.
      #
      # Yang tersisa di bawah justru bagian yang TIDAK dilakukan Vercel:
      #
      #   - Lint. Sejak Next 16, `next build` tidak lagi menjalankan ESLint
      #     (kunci konfigurasi `eslint` pun sudah hilang dari next.config).
      #     Tanpa step ini, tidak ada apa pun yang menegakkan lint.
      #   - Test. Build tidak pernah menyentuh berkas test.
      #
      # Typecheck memang juga ditegakkan `next build` di Vercel
      # (`typescript.ignoreBuildErrors` default `false`), tapi tetap
      # dipertahankan di sini karena jauh lebih cepat memberi umpan balik
      # daripada menunggu build penuh selesai.
      #
      # Step dipisah per perintah (bukan digabung "bun run lint && ...")
      # supaya begitu ada kegagalan, langsung kelihatan step mana yang merah
      # di ringkasan run.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Audit dependency. Vercel tidak melakukan ini sama sekali.
      #
      # Perintahnya ada di package.json (`bun run audit`) supaya yang jalan di
      # sini dan yang bisa dijalankan developer di lokal benar-benar sama —
      # daftar pengecualian yang menyimpang antara CI dan lokal adalah cara
      # paling mudah membuat gerbang ini bohong.
      #
      # Kenapa `--prod`: dependency dev (eslint, commitlint, shadcn) tidak
      # pernah ikut ke server maupun browser. Menyertakannya membuat step ini
      # merah terus-terusan sampai orang berhenti membacanya.
      #
      # Kenapa `--audit-level=high`: gerbang harus punya ambang, dan ambang
      # yang menangkap semuanya sama tidak bergunanya dengan tidak ada gerbang.
      #
      # TIDAK ADA `--ignore` di perintah ini, dan itu disengaja. Pengecualian
      # membungkam laporan tanpa mengganti kode yang rentan, lalu ikut
      # menyembunyikan advisory berikutnya. Bila sebuah advisory perlu
      # ditutup, pakai `overrides` di package.json supaya versinya
      # benar-benar berganti. Lihat bagian Dependency di README.
      - name: Audit
        run: bun run audit

      # src/lib/env.ts sengaja tidak punya .default() (fail-fast), jadi test
      # yang menyentuh modul env WAJIB diberi nilai atau langsung ZodError.
      # Nilai di bawah adalah dummy khusus CI — runner tidak menghubungi host
      # mana pun.
      - name: Test
        run: bun run test
        env:
          API_BASE_URL: http://127.0.0.1:3001/api
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          # Menstempel versi service worker (/sw.js?v=<id>) dan build id Next.
          # Commit SHA membuatnya stabil dan bisa ditelusuri balik ke kodenya.
          BUILD_ID: ${{ github.sha }}

      # Suite yang sama, dijalankan ulang dengan kalender digeser.
      #
      # Seluruh seed mock bertanggal RELATIF terhadap hari ini, sementara
      # sebagian test menilainya dengan patokan MUTLAK (bulan berjalan, hari
      # Minggu, tahun 2026). Campuran itu lolos diam-diam selama suite hanya
      # pernah dijalankan "hari ini", lalu pecah pada tanggal tertentu tanpa
      # satu pun commit yang menyebabkannya: 1 Oktober 2026 menjatuhkan 8 test
      # yang hijau sehari sebelumnya. Step `Test` di atas TIDAK BISA
      # menangkapnya — ia hanya tahu tanggal saat CI kebetulan berjalan.
      #
      # Tanggalnya dipilih untuk mewakili kelas kegagalannya, bukan acak:
      # 2026-11-01 (tanggal 1, sekaligus Minggu), 2026-12-31 (Kamis, hari
      # terakhir bulan sekaligus tahun), 2027-06-19 (Sabtu, dan tahun yang
      # BUKAN 2026 — kelas terbesar yang pernah ditemukan di sini adalah test
      # yang mengeja tahun ke dalam kode dokumen). Ketiganya menutup Minggu,
      # Kamis, Sabtu, awal bulan, akhir bulan, dan pergantian tahun.
      # Mekanismenya ada di tests/setup.ts (MOCK_TODAY).
      #
      # Januari dan Februari SENGAJA tidak ada di daftar: FISCAL_PERIOD hanya
      # dibangun untuk tahun berjalan dengan `month < MONTH - 1`, jadi pada
      # dua bulan itu tidak ada satu pun periode berstatus CLOSED dan
      # kas-masuk.test.ts ikut merah. Itu utang yang belum dibayar, bukan
      # tanggal yang aman — lihat catatan di scripts/mock/keuangan-store.ts.
      #
      # Langkah ini tidak wajib hijau untuk menahan rilis — karena itu
      # continue-on-error — tapi ia harus KELIHATAN, supaya kelas bug ini
      # ketahuan saat ditulis dan bukan pada tanggal ia meledak.
      - name: Test (kalender digeser)
        run: bun run test:dates
        continue-on-error: true
        env:
          API_BASE_URL: http://127.0.0.1:3001/api
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          BUILD_ID: ${{ github.sha }}
