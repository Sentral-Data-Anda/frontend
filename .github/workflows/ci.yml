name: CI

# Repo ini belum punya git remote saat berkas ini ditulis, jadi workflow ini
# belum pernah benar-benar dijalankan oleh GitHub Actions. Trigger dan step
# di bawah ditulis konservatif (versi resmi oven-sh/setup-bun + checkout),
# supaya begitu remote dipasang, workflow langsung jalan tanpa perlu diutak-atik.
on:
  push:
    branches:
      - main
      - development
      - production
  pull_request:

# Batalkan run lama pada branch/PR yang sama saat ada push baru, supaya
# tidak menumpuk run yang sudah usang.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pembagian kerja dengan Vercel.
      #
      # Target deploy aplikasi ini adalah Vercel, dan Vercel menjalankan
      # `next build` pada setiap push (preview) serta pada branch produksi.
      # Karena itu step `build` SENGAJA TIDAK ADA di sini — menjalankannya
      # dua kali hanya menggandakan waktu tunggu tanpa menambah cakupan.
      #
      # Yang tersisa di bawah justru bagian yang TIDAK dilakukan Vercel:
      #
      #   - Lint. Sejak Next 16, `next build` tidak lagi menjalankan ESLint
      #     (kunci konfigurasi `eslint` pun sudah hilang dari next.config).
      #     Tanpa step ini, tidak ada apa pun yang menegakkan lint.
      #   - Test. Build tidak pernah menyentuh berkas test.
      #
      # Typecheck memang juga ditegakkan `next build` di Vercel
      # (`typescript.ignoreBuildErrors` default `false`), tapi tetap
      # dipertahankan di sini karena jauh lebih cepat memberi umpan balik
      # daripada menunggu build penuh selesai.
      #
      # Step dipisah per perintah (bukan digabung "bun run lint && ...")
      # supaya begitu ada kegagalan, langsung kelihatan step mana yang merah
      # di ringkasan run.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Audit dependency. Vercel tidak melakukan ini sama sekali.
      #
      # Perintahnya ada di package.json (`bun run audit`) supaya yang jalan di
      # sini dan yang bisa dijalankan developer di lokal benar-benar sama —
      # daftar pengecualian yang menyimpang antara CI dan lokal adalah cara
      # paling mudah membuat gerbang ini bohong.
      #
      # Kenapa `--prod`: dependency dev (eslint, commitlint, shadcn) tidak
      # pernah ikut ke server maupun browser. Menyertakannya membuat step ini
      # merah terus-terusan sampai orang berhenti membacanya.
      #
      # Kenapa `--audit-level=high`: gerbang harus punya ambang, dan ambang
      # yang menangkap semuanya sama tidak bergunanya dengan tidak ada gerbang.
      #
      # Daftar `--ignore` di package.json: lihat bagian Dependency di README
      # untuk alasan per advisory dan syarat kapan boleh dicabut. Semuanya
      # berujung pada versi yang DIPIN NEXT SENDIRI, jadi tidak bisa
      # diperbaiki dari repo ini tanpa menabrak pin upstream. Advisory baru di
      # luar daftar itu TETAP membuat step ini merah — itu memang gunanya.
      - name: Audit
        run: bun run audit

      # src/lib/env.ts sengaja tidak punya .default() (fail-fast), jadi test
      # yang menyentuh modul env WAJIB diberi nilai atau langsung ZodError.
      # Nilai di bawah adalah dummy khusus CI — runner tidak menghubungi host
      # mana pun.
      - name: Test
        run: bun run test
        env:
          API_BASE_URL: http://127.0.0.1:3001/api
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          # Menstempel versi service worker (/sw.js?v=<id>) dan build id Next.
          # Commit SHA membuatnya stabil dan bisa ditelusuri balik ke kodenya.
          BUILD_ID: ${{ github.sha }}
